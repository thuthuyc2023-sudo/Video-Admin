<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Admin Video</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <section class="card">
        <h2>Đăng nhập</h2>
        <form id="loginForm">
            <label>Username <input type="text" name="username" required></label>
            <label>Password <input type="password" name="password" required></label>
            <button type="submit">Login</button>
        </form>
        <p id="msg"></p>
        <p><a href="register.html">Đăng ký</a> | <a href="forgot.html">Quên mật khẩu</a></p>
    </section>
    <script type="module">
        import {login} from "./js/auth.js";
        const form = document.getElementById('loginForm');
        const msg = document.getElementById('msg');
        form.addEventListener('submit', async e => {
            e.preventDefault();
            const data = new FormData(form);
            const ok = await login(data.get('username'), data.get('password'));
            if (ok) location.href = 'index.html';
            else msg.textContent = 'Sai tài khoản hoặc mật khẩu';
        });
    </script>
</body>
</html>
